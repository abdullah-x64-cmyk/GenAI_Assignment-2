name: Build IEEE technical report

on:
  push:
    paths:
      - 'report/**'
      - '.github/workflows/report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install free LaTeX tools on the hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-publishers texlive-fonts-recommended latexmk
      - name: Compile IEEE source with bibliography
        working-directory: report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Preserve PDF and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IEEE-technical-report
          path: |
            report/main.pdf
            report/main.log
            report/main.bbl
          if-no-files-found: error
